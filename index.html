<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общий Чат</title>
    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-outline: #79747E;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); display: flex; justify-content: center; height: 100vh; }

        .app-container { width: 100%; max-width: 600px; height: 100vh; display: flex; flex-direction: column; background: var(--md-sys-color-surface); border-left: 1px solid var(--md-sys-color-outline); border-right: 1px solid var(--md-sys-color-outline); }
        
        .screen { display: flex; flex-direction: column; height: 100%; padding: 20px; gap: 16px; }
        .hidden { display: none !important; }

        .auth-card { margin: auto 0; background: var(--md-sys-color-surface-container-high); padding: 24px; border-radius: 28px; display: flex; flex-direction: column; gap: 16px; }
        h2 { font-weight: 500; color: var(--md-sys-color-on-surface); text-align: center; }
        
        input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--md-sys-color-outline); background: transparent; color: var(--md-sys-color-on-surface); outline: none; }
        input:focus { border-color: var(--md-sys-color-primary); border-width: 2px; }

        .avatars-grid { display: flex; justify-content: space-around; margin: 10px 0; }
        .avatar-option { width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .avatar-option.selected { border-color: var(--md-sys-color-primary); transform: scale(1.1); }

        button { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: none; padding: 12px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }

        header { padding: 16px; background: var(--md-sys-color-surface-container-high); border-bottom: 1px solid var(--md-sys-color-outline); display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 36px; height: 36px; border-radius: 50%; }

        .messages-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
        
        .message-item { display: flex; gap: 10px; background: var(--md-sys-color-surface-container-high); padding: 10px 14px; border-radius: 16px; max-width: 80%; width: fit-content; }
        .message-item.my-msg { margin-left: auto; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; }
        .msg-content { display: flex; flex-direction: column; }
        .msg-author { font-size: 12px; font-weight: bold; opacity: 0.7; }
        .msg-text { margin-top: 2px; word-break: break-word; }

        .input-area { display: flex; gap: 8px; padding-top: 8px; }
        .input-area input { flex: 1; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <h2>Вход в Чат</h2>
            <input type="text" id="username-input" placeholder="Введите ваш никнейм">
            <div>
                <p style="font-size: 14px; margin-bottom: 8px;">Выберите аватарку:</p>
                <div class="avatars-grid">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=1" class="avatar-option selected" onclick="selectAvatar(this)">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=2" class="avatar-option" onclick="selectAvatar(this)">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=3" class="avatar-option" onclick="selectAvatar(this)">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=4" class="avatar-option" onclick="selectAvatar(this)">
                </div>
            </div>
            <button onclick="login()">Войти</button>
        </div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <header>
            <div class="user-info">
                <img id="current-avatar" src="" alt="avatar">
                <span id="current-name" style="font-weight: 600;"></span>
            </div>
            <button onclick="logout()" style="padding: 6px 12px; font-size: 12px;">Выйти</button>
        </header>

        <div class="messages-list" id="messages-list"></div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://maxdimacookie-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    let currentUser = null;
    let selectedAvatarUrl = "https://api.dicebear.com/7.x/bottts/svg?seed=1";

    window.selectAvatar = (el) => {
        document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
        el.classList.add('selected');
        selectedAvatarUrl = el.src;
    };

    window.login = () => {
        const name = document.getElementById('username-input').value.trim();
        if (!name) return alert('Введите имя!');
        
        currentUser = { name, avatar: selectedAvatarUrl };
        document.getElementById('current-name').textContent = name;
        document.getElementById('current-avatar').src = selectedAvatarUrl;

        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');

        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            displayMessage(data);
        });
    };

    window.logout = () => {
        location.reload();
    };

    window.sendMessage = () => {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text) return;

        push(messagesRef, {
            user: currentUser.name,
            avatar: currentUser.avatar,
            text: text,
            timestamp: Date.now()
        });

        input.value = '';
    };

    function displayMessage(data) {
        const list = document.getElementById('messages-list');
        const isMy = currentUser && data.user === currentUser.name;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message-item ${isMy ? 'my-msg' : ''}`;
        msgDiv.innerHTML = `
            ${!isMy ? `<img src="${data.avatar}" class="msg-avatar">` : ''}
            <div class="msg-content">
                ${!isMy ? `<span class="msg-author">${data.user}</span>` : ''}
                <span class="msg-text">${escapeHtml(data.text)}</span>
            </div>
        `;

        list.appendChild(msgDiv);
        list.scrollTop = list.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
