<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
    <title>MAX DIMA COOKIE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #09090B;
            --surface-color: #121215;
            --surface-bright: #1C1C21;
            --primary-color: #FF6F00;
            --primary-hover: #E65100;
            --text-color: #FAFAFA;
            --text-muted: #A1A1AA;
            --border-color: #27272A;
            --my-msg-bg: #C2410C;
            --glass-bg: rgba(24, 24, 27, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --shadow-float: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; border-radius: 0 !important; }
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; }

        .app-container { width: 100%; max-width: 650px; height: 100dvh; display: flex; flex-direction: column; background: var(--surface-color); border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); position: relative; }
        .screen { display: flex; flex-direction: column; height: 100%; padding: 14px; gap: 14px; overflow: hidden; position: relative; }
        .hidden { display: none !important; }

        .auth-card { margin: auto 0; background: var(--surface-bright); padding: 24px; border: 1px solid var(--glass-border); box-shadow: var(--shadow-float); display: flex; flex-direction: column; gap: 16px; }
        .auth-welcome { font-weight: 700; font-size: 16px; text-align: center; color: var(--primary-color); letter-spacing: 0.5px; text-transform: uppercase; }
        .auth-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: var(--text-muted); font-weight: 600; }
        .auth-tab.active { background: var(--primary-color); color: #FFF; }
        
        input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; font-size: 16px; }
        input:focus, select:focus { border-color: var(--primary-color); }

        .custom-file-btn { display: block; padding: 10px; background: var(--bg-color); border: 1px dashed var(--border-color); text-align: center; cursor: pointer; font-size: 13px; color: var(--text-muted); }
        button.btn-main { background: var(--primary-color); color: #FFF; border: none; padding: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        button.btn-main:hover { background: var(--primary-hover); }

        header { padding: 14px; background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); box-shadow: var(--shadow-float); display: flex; justify-content: space-between; align-items: center; z-index: 10; gap: 10px; }
        .header-title { font-weight: 700; font-size: 15px; letter-spacing: 1px; color: var(--primary-color); text-align: center; flex: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .avatar-view { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--bg-color); border: 1px solid var(--border-color); overflow: hidden; flex-shrink: 0; position: relative; transition: filter 0.3s ease; }
        .avatar-view.offline { filter: grayscale(100%); opacity: 0.6; }
        .avatar-view .status-dot { position: absolute; bottom: 2px; right: 2px; width: 8px; height: 8px; background: #4CAF50; border: 1px solid var(--bg-color); }
        .avatar-view.offline .status-dot { background: #757575; }

        .icon-btn { background: transparent; border: none; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; }
        .icon-btn:hover { background: var(--glass-bg); color: var(--primary-color); }

        .messages-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 4px; }
        .system-msg { align-self: center; background: var(--surface-bright); border: 1px solid var(--glass-border); padding: 6px 14px; font-size: 12px; color: var(--primary-color); font-weight: 500; letter-spacing: 0.5px; box-shadow: var(--shadow-float); }

        .message-wrapper { display: flex; gap: 10px; max-width: 85%; align-self: flex-start; align-items: flex-start; }
        .message-wrapper.my-msg { align-self: flex-end; flex-direction: row-reverse; }

        .message-item { background: var(--glass-bg); backdrop-filter: blur(8px); padding: 10px 14px; border: 1px solid var(--glass-border); box-shadow: var(--shadow-float); position: relative; user-select: none; cursor: pointer; word-break: break-word; }
        .message-wrapper.my-msg .message-item { background: var(--my-msg-bg); border-color: transparent; }
        .message-item.deleted-msg { opacity: 0.45; border: 1px dashed #FF5252 !important; }
        .deleted-tag { font-size: 10px; color: #FF5252; font-weight: bold; margin-bottom: 4px; display: block; }

        .msg-author { font-size: 11px; font-weight: 700; color: var(--primary-color); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .message-wrapper.my-msg .msg-author { display: none; }
        .reply-quote { background: rgba(0,0,0,0.3); border-left: 2px solid var(--primary-color); padding: 4px 8px; font-size: 12px; margin-bottom: 6px; color: var(--text-muted); }

        .big-emoji { font-size: 38px; line-height: 1.2; display: inline-block; }

        .msg-media { max-width: 100%; max-height: 220px; margin-top: 6px; display: block; border: 1px solid var(--border-color); }

        .custom-audio-player { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3); padding: 6px 10px; margin-top: 6px; border: 1px solid var(--glass-border); width: 210px; }
        .audio-play-btn { background: var(--primary-color); border: none; color: #fff; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .audio-progress-container { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .audio-progress-bar { width: 100%; height: 4px; background: var(--border-color); cursor: pointer; position: relative; }
        .audio-progress-fill { height: 100%; background: var(--primary-color); width: 0%; }
        .audio-time { font-size: 10px; color: var(--text-muted); }

        .reactions-bar { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .reaction-badge { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 2px 6px; font-size: 11px; display: flex; align-items: center; gap: 4px; }

        .reply-banner { background: var(--surface-bright); padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; border: 1px solid var(--glass-border); border-bottom: none; }
        
        /* Исправленный блок ввода */
        .input-area { display: flex; gap: 8px; align-items: center; position: relative; margin-top: auto; padding-bottom: max(6px, env(safe-area-inset-bottom)); width: 100%; }
        
        .glass-input-box { flex: 1; background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); box-shadow: var(--shadow-float); display: flex; align-items: center; }
        .glass-input-box input { border: none; background: transparent; padding: 12px; font-size: 16px; }

        .square-btn { width: 44px; height: 44px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(12px); box-shadow: var(--shadow-float); color: var(--text-color); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .square-btn.primary { background: var(--primary-color); border: none; }
        .square-btn.recording { background: #E53935; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .attach-popover { position: absolute; bottom: 56px; left: 0; background: var(--surface-bright); border: 1px solid var(--glass-border); box-shadow: var(--shadow-float); padding: 4px; display: flex; flex-direction: column; gap: 2px; z-index: 50; width: 200px; }
        .attach-opt { display: flex; align-items: center; gap: 10px; padding: 10px; font-size: 13px; cursor: pointer; }
        .attach-opt:hover { background: var(--glass-bg); color: var(--primary-color); }

        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-card { background: var(--surface-bright); border: 1px solid var(--glass-border); box-shadow: var(--shadow-float); padding: 20px; width: 330px; display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow-y: auto; }
        
        .reactions-selector { display: flex; justify-content: space-between; font-size: 20px; background: var(--bg-color); padding: 10px; border: 1px solid var(--border-color); }
        .reactions-selector span { cursor: pointer; }
        .menu-action { padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); text-align: center; font-weight: 600; cursor: pointer; font-size: 13px; }
        .menu-action.danger { color: #FF5252; border-color: rgba(255, 82, 82, 0.3); }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; }
        .toggle-row input { width: auto; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <div class="auth-welcome">Добро пожаловать в MAX дима куки</div>
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="setAuthMode('login')">Вход</div>
                <div class="auth-tab" onclick="setAuthMode('register')">Регистрация</div>
            </div>
            <input type="text" id="auth-username" placeholder="Никнейм">
            <input type="password" id="auth-password" placeholder="Пароль">

            <div class="avatar-picker">
                <label class="custom-file-btn">
                    Загрузить фото профиля
                    <input type="file" id="avatar-file" accept="image/*" style="display:none;" onchange="handleAvatarUpload(this)">
                </label>
                <div id="avatar-status" style="font-size: 11px; color: var(--primary-color); text-align: center; display: none;">Картинка выбрана!</div>
            </div>

            <button class="btn-main" id="auth-submit-btn" onclick="handleAuth()">Войти</button>
        </div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <header>
            <button class="icon-btn" onclick="openSettings()"><span class="material-symbols-outlined">settings</span></button>
            <button id="back-to-global-btn" class="icon-btn hidden" onclick="openGlobalChat()"><span class="material-symbols-outlined">arrow_back</span></button>
            <div class="header-title" id="header-title">MAX DIMA COOKIE</div>
            <div id="header-avatar" class="avatar-view"></div>
        </header>

        <div class="messages-list" id="messages-list"></div>

        <div id="reply-banner" class="reply-banner hidden">
            <span>Ответ на: <b id="reply-target-text"></b></span>
            <span onclick="cancelReply()" style="cursor:pointer;">✕</span>
        </div>

        <div class="input-area" id="input-area">
            <div id="attach-popover" class="attach-popover hidden">
                <label class="attach-opt">
                    <span class="material-symbols-outlined">image</span> Фото / Видео
                    <input type="file" accept="image/*,video/*" style="display:none;" onchange="sendMedia(this)">
                </label>
                <div class="attach-opt" onclick="toggleVoiceRecording()">
                    <span class="material-symbols-outlined">mic</span> Голосовое
                </div>
            </div>

            <button class="square-btn" onclick="toggleAttachMenu()"><span class="material-symbols-outlined">attach_file</span></button>
            
            <div class="glass-input-box">
                <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendTextMessage()">
            </div>

            <button id="rec-btn" class="square-btn hidden recording" onclick="stopVoiceRecording()"><span class="material-symbols-outlined">stop</span></button>
            <button class="square-btn primary" onclick="sendTextMessage()"><span class="material-symbols-outlined">send</span></button>
        </div>
    </div>

    <div id="settings-modal" class="modal hidden" onclick="closeSettings(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 style="text-align:center; font-size: 16px;">НАСТРОЙКИ</h3>
            
            <div style="display:flex; flex-direction:column; gap:10px;">
                <label style="font-size:11px; color:var(--text-muted);">Изменить никнейм:</label>
                <input type="text" id="setting-new-name" placeholder="Новый ник">
                <button class="btn-main" onclick="changeUsername()" style="font-size:12px; padding:8px;">Сохранить ник</button>

                <label style="font-size:11px; color:var(--text-muted); margin-top:6px;">Изменить аватарку:</label>
                <label class="custom-file-btn">
                    Выбрать новое фото
                    <input type="file" accept="image/*" style="display:none;" onchange="changeAvatar(this)">
                </label>

                <div class="toggle-row" style="margin-top:8px;">
                    <span>Видеть удаленные сообщения</span>
                    <input type="checkbox" id="setting-show-deleted" onchange="toggleShowDeleted(this)">
                </div>
            </div>

            <div id="admin-tools" class="hidden" style="display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--border-color); padding-top:12px; margin-top:6px;">
                <span style="font-size:11px; color:var(--primary-color); font-weight:bold; letter-spacing: 0.5px;">АДМИН-ПАНЕЛЬ</span>
                
                <label style="font-size:11px; color:var(--text-muted);">Писать от лица:</label>
                <select id="fake-user-select">
                    <option value="">От себя</option>
                </select>

                <button class="btn-main" onclick="checkUserPassword()" style="font-size:12px; padding:8px;">Узнать пароль</button>
                <button class="btn-main" onclick="grantAdmin()" style="font-size:12px; padding:8px; background:var(--surface-bright); border:1px solid var(--primary-color);">Выдать админку</button>
            </div>

            <button class="btn-main" onclick="logout()" style="background:#E53935; margin-top:10px;">Выйти</button>
        </div>
    </div>

    <div id="context-menu" class="modal hidden" onclick="closeContextMenu(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="reactions-selector">
                <span onclick="addReaction('👍')">👍</span>
                <span onclick="addReaction('👎')">👎</span>
                <span onclick="addReaction('❤️')">❤️</span>
                <span onclick="addReaction('🔥')">🔥</span>
                <span onclick="addReaction('💩')">💩</span>
            </div>
            <div class="menu-action" onclick="prepareReply()">Ответить</div>
            <div id="dm-action" class="menu-action" onclick="startDirectMessage()">Написать в личку</div>
            <div id="delete-action" class="menu-action danger hidden" onclick="deleteTargetMessage()">Удалить</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, child, onChildAdded, onChildChanged, onChildRemoved, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://maxdimacookie-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let authMode = 'login';
    let selectedAvatar = { type: 'emoji', val: '👤' };
    let currentUser = null;
    let currentChatType = 'global';
    let activeDmUser = null;
    let replyToMsg = null;
    let selectedMsgId = null;
    let selectedMsgData = null;
    let pressTimer = null;
    let usersStatusMap = {};

    let showDeletedPref = localStorage.getItem('show_deleted_pref') === 'true';

    let mediaRecorder = null;
    let audioChunks = [];
    let recordedAudioBase64 = null;

    let loadedMessageIds = new Set();
    let isInitialLoad = true;

    window.addEventListener('DOMContentLoaded', () => {
        requestNotificationPermission();

        const saved = localStorage.getItem('chat_user');
        if (saved) {
            currentUser = JSON.parse(saved);
            openChat();
        }
        document.getElementById('setting-show-deleted').checked = showDeletedPref;

        const input = document.getElementById('message-input');
        input.addEventListener('paste', handlePasteEvent);
    });

    function requestNotificationPermission() {
        if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission();
        }
    }

    function sendSystemNotification(sender, where, messageText) {
        if (!("Notification" in window) || Notification.permission !== "granted") return;
        if (currentUser && sender === currentUser.name) return;

        const title = `${sender} (${where})`;
        const options = {
            body: messageText,
            icon: 'https://cdn-icons-png.flaticon.com/512/732/732200.png'
        };

        new Notification(title, options);
    }

    window.setAuthMode = (mode) => {
        authMode = mode;
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
    };

    window.handleAvatarUpload = (input) => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            selectedAvatar = { type: 'img', val: e.target.result };
            document.getElementById('avatar-status').style.display = 'block';
        };
        reader.readAsDataURL(file);
    };

    window.handleAuth = async () => {
        requestNotificationPermission();
        const name = document.getElementById('auth-username').value.trim();
        const pass = document.getElementById('auth-password').value.trim();

        if (!name || !pass) return alert('Заполните ник и пароль!');

        const userSnap = await get(child(ref(db, 'users'), name));

        if (authMode === 'register') {
            if (userSnap.exists()) return alert('Никнейм уже занят!');
            const userData = { pass, avatar: selectedAvatar, role: name === 'kuzyaalica' ? 'owner' : 'user' };
            await set(child(ref(db, 'users'), name), userData);
            currentUser = { name, avatar: selectedAvatar, role: userData.role };
            
            push(ref(db, 'messages'), {
                isSystem: true,
                text: `${name} теперь в макс дима куки`,
                timestamp: Date.now()
            });

            saveAndLogin();
        } else {
            if (!userSnap.exists()) return alert('Пользователь не найден!');
            const val = userSnap.val();
            if (val.pass !== pass) return alert('Неверный пароль!');
            currentUser = { name, avatar: val.avatar, role: val.role || (name === 'kuzyaalica' ? 'owner' : 'user') };
            saveAndLogin();
        }
    };

    function saveAndLogin() {
        localStorage.setItem('chat_user', JSON.stringify(currentUser));
        openChat();
    }

    async function openChat() {
        setupPresence();
        listenUsersStatus();
        listenGlobalNotifications();

        const userSnap = await get(child(ref(db, 'users'), currentUser.name));
        if (userSnap.exists()) {
            currentUser.role = userSnap.val().role || (currentUser.name === 'kuzyaalica' ? 'owner' : 'user');
            currentUser.avatar = userSnap.val().avatar || currentUser.avatar;
        }

        renderAvatar(document.getElementById('header-avatar'), currentUser.avatar, currentUser.name);
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');

        openGlobalChat();
    }

    function setupPresence() {
        const userStatusRef = ref(db, `status/${currentUser.name}`);
        const connectedRef = ref(db, '.info/connected');

        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                onDisconnect(userStatusRef).set('offline');
                set(userStatusRef, 'online');
            }
        });
    }

    function listenUsersStatus() {
        onValue(ref(db, 'status'), (snap) => {
            usersStatusMap = snap.val() || {};
            refreshAllAvatars();
        });
    }

    function listenGlobalNotifications() {
        let isFirstLoad = true;
        
        onChildAdded(ref(db, 'messages'), (snap) => {
            if (isFirstLoad) return;
            const data = snap.val();
            if (data && !data.isSystem) {
                let previewText = data.text || (data.img ? '📷 Фото' : data.video ? '🎥 Видео' : data.audio ? '🎤 Голосовое сообщение' : 'Сообщение');
                sendSystemNotification(data.user, 'Общий чат', previewText);
            }
        });

        get(ref(db, 'messages')).then(() => {
            isFirstLoad = false;
        });

        onValue(ref(db, 'direct_messages'), (snap) => {
            const allDms = snap.val();
            if (!allDms) return;

            Object.entries(allDms).forEach(([chatId, messages]) => {
                const parts = chatId.split('_');
                if (parts.includes(currentUser.name)) {
                    const otherUser = parts.find(u => u !== currentUser.name);
                    
                    Object.entries(messages).forEach(([msgId, msgData]) => {
                        if (!loadedMessageIds.has(msgId)) {
                            loadedMessageIds.add(msgId);
                            if (!isInitialLoad && msgData.user !== currentUser.name && !msgData.isSystem) {
                                let previewText = msgData.text || (msgData.img ? '📷 Фото' : msgData.video ? '🎥 Видео' : msgData.audio ? '🎤 Голосовое сообщение' : 'Сообщение');
                                sendSystemNotification(msgData.user, 'Личка', previewText);
                            }
                        }
                    });
                }
            });
            isInitialLoad = false;
        });
    }

    function refreshAllAvatars() {
        renderAvatar(document.getElementById('header-avatar'), currentUser.avatar, currentUser.name);
        if (currentChatType === 'global') {
            loadChatMessages(ref(db, 'messages'));
        } else {
            const chatId = getDmChatId(currentUser.name, activeDmUser);
            loadChatMessages(ref(db, `direct_messages/${chatId}`));
        }
    }

    window.openGlobalChat = () => {
        currentChatType = 'global';
        activeDmUser = null;
        document.getElementById('header-title').textContent = "MAX DIMA COOKIE";
        document.getElementById('back-to-global-btn').classList.add('hidden');
        loadChatMessages(ref(db, 'messages'));
    };

    function getDmChatId(u1, u2) {
        return [u1, u2].sort().join('_');
    }

    window.startDirectMessage = () => {
        if (!selectedMsgData || selectedMsgData.user === currentUser.name) return;
        activeDmUser = selectedMsgData.user;
        currentChatType = 'dm';
        closeContextMenu();

        document.getElementById('header-title').textContent = `ЛС: ${activeDmUser}`;
        document.getElementById('back-to-global-btn').classList.remove('hidden');
        
        const chatId = getDmChatId(currentUser.name, activeDmUser);
        loadChatMessages(ref(db, `direct_messages/${chatId}`));
    };

    let activeMessagesRef = null;
    function loadChatMessages(targetRef) {
        activeMessagesRef = targetRef;
        document.getElementById('messages-list').innerHTML = '';
        
        get(targetRef).then((snap) => {
            if (snap.exists()) {
                Object.entries(snap.val()).forEach(([id, val]) => renderMessage(id, val));
            }
        });

        onChildAdded(targetRef, (snap) => renderMessage(snap.key, snap.val()));
        onChildChanged(targetRef, (snap) => updateMessageUI(snap.key, snap.val()));
        onChildRemoved(targetRef, (snap) => {
            const el = document.getElementById(`msg-${snap.key}`);
            if (el) el.remove();
        });
    }

    window.logout = () => {
        if (currentUser) {
            set(ref(db, `status/${currentUser.name}`), 'offline');
        }
        localStorage.removeItem('chat_user');
        location.reload();
    };

    window.openSettings = async () => {
        document.getElementById('settings-modal').classList.remove('hidden');
        document.getElementById('setting-new-name').value = currentUser.name;
        
        const isAdmin = currentUser.role === 'owner' || currentUser.role === 'admin';
        document.getElementById('admin-tools').classList.toggle('hidden', !isAdmin);

        if (isAdmin) {
            const select = document.getElementById('fake-user-select');
            select.innerHTML = '<option value="">От себя</option>';
            
            const snap = await get(ref(db, 'users'));
            if (snap.exists()) {
                Object.keys(snap.val()).forEach(author => {
                    if (currentUser.role === 'admin' && author === 'kuzyaalica') return;
                    const opt = document.createElement('option');
                    opt.value = author;
                    opt.textContent = author;
                    select.appendChild(opt);
                });
            }
        }
    };

    window.closeSettings = () => document.getElementById('settings-modal').classList.add('hidden');

    window.changeUsername = async () => {
        const newName = document.getElementById('setting-new-name').value.trim();
        if (!newName || newName === currentUser.name) return;

        const checkSnap = await get(child(ref(db, 'users'), newName));
        if (checkSnap.exists()) return alert('Никнейм уже занят!');

        const userSnap = await get(child(ref(db, 'users'), currentUser.name));
        if (userSnap.exists()) {
            const userData = userSnap.val();
            await set(child(ref(db, 'users'), newName), userData);
            await set(child(ref(db, 'users'), currentUser.name), null);
            await set(child(ref(db, 'status'), newName), 'online');
            await set(child(ref(db, 'status'), currentUser.name), null);

            currentUser.name = newName;
            localStorage.setItem('chat_user', JSON.stringify(currentUser));
            alert('Ник успешно изменен!');
            closeSettings();
            refreshAllAvatars();
        }
    };

    window.changeAvatar = (input) => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const newAvatar = { type: 'img', val: e.target.result };
            await update(child(ref(db, 'users'), currentUser.name), { avatar: newAvatar });
            currentUser.avatar = newAvatar;
            localStorage.setItem('chat_user', JSON.stringify(currentUser));
            alert('Аватар обновлен!');
            closeSettings();
            refreshAllAvatars();
        };
        reader.readAsDataURL(file);
    };

    window.toggleShowDeleted = (checkbox) => {
        showDeletedPref = checkbox.checked;
        localStorage.setItem('show_deleted_pref', showDeletedPref);
        refreshAllAvatars();
    };

    window.checkUserPassword = async () => {
        const targetName = prompt('Введите никнейм человека:');
        if (!targetName) return;

        if (targetName === 'kuzyaalica' && currentUser.name !== 'kuzyaalica') {
            return alert('Нельзя узнавать пароль главного админа!');
        }

        const targetSnap = await get(child(ref(db, 'users'), targetName));
        if (targetSnap.exists()) {
            const tVal = targetSnap.val();
            if (tVal.role === 'admin' && currentUser.role !== 'owner') {
                return alert('Нельзя узнавать пароли других админов!');
            }
            alert(`Пароль пользователя ${targetName}: ${tVal.pass}`);
        } else {
            alert('Пользователь не найден!');
        }
    };

    window.grantAdmin = async () => {
        const targetName = prompt('Введите никнейм кому выдать админку:');
        if (!targetName) return;

        const targetSnap = await get(child(ref(db, 'users'), targetName));
        if (targetSnap.exists()) {
            await update(child(ref(db, 'users'), targetName), { role: 'admin' });
            alert(`Пользователь ${targetName} теперь админ!`);
        } else {
            alert('Пользователь не найден!');
        }
    };

    async function getSenderData() {
        const isAdmin = currentUser.role === 'owner' || currentUser.role === 'admin';
        if (isAdmin) {
            const fakeName = document.getElementById('fake-user-select').value;
            if (fakeName) {
                const snap = await get(child(ref(db, 'users'), fakeName));
                const fakeAvatar = snap.exists() ? snap.val().avatar : { type: 'emoji', val: '👤' };
                return { name: fakeName, avatar: fakeAvatar };
            }
        }
        return { name: currentUser.name, avatar: currentUser.avatar };
    }

    window.sendTextMessage = async () => {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text && !recordedAudioBase64) return;

        const sender = await getSenderData();

        const msgPayload = {
            user: sender.name,
            avatar: sender.avatar,
            reply: replyToMsg,
            timestamp: Date.now()
        };

        if (text) msgPayload.text = text;
        if (recordedAudioBase64) {
            msgPayload.audio = recordedAudioBase64;
            recordedAudioBase64 = null;
        }

        push(activeMessagesRef, msgPayload);
        input.value = '';
        cancelReply();
    };

    function handlePasteEvent(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
            if (item.type.indexOf('image') !== -1 || item.type.indexOf('video') !== -1) {
                const blob = item.getAsFile();
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const sender = await getSenderData();
                    const payload = {
                        user: sender.name,
                        avatar: sender.avatar,
                        reply: replyToMsg,
                        timestamp: Date.now()
                    };
                    if (item.type.indexOf('video') !== -1) payload.video = event.target.result;
                    else payload.img = event.target.result;

                    push(activeMessagesRef, payload);
                    cancelReply();
                };
                reader.readAsDataURL(blob);
            }
        }
    }

    window.sendMedia = async (input) => {
        const file = input.files[0];
        if (!file) return;
        const sender = await getSenderData();
        const isVideo = file.type.startsWith('video');

        const reader = new FileReader();
        reader.onload = (e) => {
            const payload = {
                user: sender.name,
                avatar: sender.avatar,
                reply: replyToMsg,
                timestamp: Date.now()
            };
            if (isVideo) payload.video = e.target.result;
            else payload.img = e.target.result;

            push(activeMessagesRef, payload);
            cancelReply();
            input.value = '';
            toggleAttachMenu();
        };
        reader.readAsDataURL(file);
    };

    window.toggleAttachMenu = () => {
        document.getElementById('attach-popover').classList.toggle('hidden');
    };

    window.toggleVoiceRecording = async () => {
        toggleAttachMenu();
        if (!navigator.mediaDevices) return alert('Микрофон недоступен');
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    recordedAudioBase64 = e.target.result;
                    document.getElementById('message-input').placeholder = "Голосовое готово! Нажмите Send ➤";
                };
                reader.readAsDataURL(blob);
            };

            mediaRecorder.start();
            document.getElementById('rec-btn').classList.remove('hidden');
            document.getElementById('message-input').placeholder = "Запись микрофона...";
        } catch (err) {
            alert('Ошибка доступа к микрофону!');
        }
    };

    window.stopVoiceRecording = () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            document.getElementById('rec-btn').classList.add('hidden');
        }
    };

    function isOnlyEmojis(str) {
        const emojiRegex = /^(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff]){1,3}$/g;
        return emojiRegex.test(str.trim());
    }

    function renderMessage(id, data) {
        let el = document.getElementById(`msg-${id}`);
        const list = document.getElementById('messages-list');

        if (data.isSystem) {
            if (!el) {
                el = document.createElement('div');
                el.className = 'system-msg';
                el.id = `msg-${id}`;
                el.textContent = data.text;
                list.appendChild(el);
            }
            list.scrollTop = list.scrollHeight;
            return;
        }

        const isAdmin = currentUser && (currentUser.role === 'owner' || currentUser.role === 'admin');

        if (data.deleted && !isAdmin && !showDeletedPref) {
            if (el) el.remove();
            return;
        }

        const isMy = currentUser && data.user === currentUser.name;

        if (!el) {
            el = document.createElement('div');
            el.className = `message-wrapper ${isMy ? 'my-msg' : ''}`;
            el.id = `msg-${id}`;
            list.appendChild(el);
        }

        el.innerHTML = '';

        const avDiv = document.createElement('div');
        avDiv.className = 'avatar-view';
        renderAvatar(avDiv, data.avatar, data.user);

        const item = document.createElement('div');
        item.className = `message-item ${data.deleted ? 'deleted-msg' : ''}`;

        item.addEventListener('touchstart', () => { pressTimer = setTimeout(() => openContextMenu(id, data), 500); });
        item.addEventListener('touchend', () => clearTimeout(pressTimer));
        item.addEventListener('click', () => openContextMenu(id, data));

        let contentHTML = '';

        if (data.deleted) {
            contentHTML += `<span class="deleted-tag">[УДАЛЕНО СООБЩЕНИЕ]</span>`;
        }

        contentHTML += `<div class="msg-author">${data.user}</div>`;

        if (data.reply) {
            contentHTML += `<div class="reply-quote"><b>${data.reply.user}:</b> ${data.reply.text || 'Медиа'}</div>`;
        }

        if (data.text) {
            if (isOnlyEmojis(data.text)) {
                contentHTML += `<div class="big-emoji">${escapeHtml(data.text)}</div>`;
            } else {
                contentHTML += `<div>${escapeHtml(data.text)}</div>`;
            }
        }

        if (data.img) contentHTML += `<img src="${data.img}" class="msg-media">`;
        if (data.video) contentHTML += `<video src="${data.video}" controls class="msg-media"></video>`;
        
        if (data.audio) {
            contentHTML += `
                <div class="custom-audio-player" onclick="event.stopPropagation()">
                    <button class="audio-play-btn" onclick="toggleAudioPlay(this, '${data.audio}')">▶</button>
                    <div class="audio-progress-container">
                        <div class="audio-progress-bar" onclick="seekAudio(event, this)">
                            <div class="audio-progress-fill"></div>
                        </div>
                        <div class="audio-time">0:00</div>
                    </div>
                </div>
            `;
        }

        contentHTML += `<div class="reactions-bar" id="react-${id}"></div>`;

        item.innerHTML = contentHTML;
        el.appendChild(avDiv);
        el.appendChild(item);

        updateReactionsUI(id, data.reactions);
        list.scrollTop = list.scrollHeight;
    }

    function updateMessageUI(id, data) {
        renderMessage(id, data);
    }

    function updateReactionsUI(id, reactions) {
        const bar = document.getElementById(`react-${id}`);
        if (!bar) return;
        bar.innerHTML = '';
        if (!reactions) return;

        const counts = {};
        Object.values(reactions).forEach(r => counts[r] = (counts[r] || 0) + 1);

        Object.entries(counts).forEach(([emoji, count]) => {
            const badge = document.createElement('span');
            badge.className = 'reaction-badge';
            badge.textContent = `${emoji} ${count}`;
            bar.appendChild(badge);
        });
    }

    function renderAvatar(el, avatarData, userName) {
        el.innerHTML = '';
        if (!avatarData) avatarData = { type: 'emoji', val: '👤' };

        const isOnline = usersStatusMap[userName] === 'online';
        if (isOnline) {
            el.classList.remove('offline');
        } else {
            el.classList.add('offline');
        }

        if (avatarData.type === 'emoji') {
            el.textContent = avatarData.val;
        } else {
            const img = document.createElement('img');
            img.src = avatarData.val;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            el.appendChild(img);
        }

        const dot = document.createElement('div');
        dot.className = 'status-dot';
        el.appendChild(dot);
    }

    let activeAudio = null;
    let activeBtn = null;
    window.toggleAudioPlay = (btn, audioSrc) => {
        if (activeAudio && activeBtn === btn) {
            if (activeAudio.paused) {
                activeAudio.play();
                btn.textContent = '❚❚';
            } else {
                activeAudio.pause();
                btn.textContent = '▶';
            }
            return;
        }

        if (activeAudio) {
            activeAudio.pause();
            if (activeBtn) activeBtn.textContent = '▶';
        }

        activeAudio = new Audio(audioSrc);
        activeBtn = btn;
        btn.textContent = '❚❚';

        const player = btn.closest('.custom-audio-player');
        const fill = player.querySelector('.audio-progress-fill');
        const timeLabel = player.querySelector('.audio-time');

        activeAudio.ontimeupdate = () => {
            if (!activeAudio.duration) return;
            const pct = (activeAudio.currentTime / activeAudio.duration) * 100;
            fill.style.width = `${pct}%`;
            
            const mins = Math.floor(activeAudio.currentTime / 60);
            const secs = Math.floor(activeAudio.currentTime % 60);
            timeLabel.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        activeAudio.onended = () => {
            btn.textContent = '▶';
            fill.style.width = '0%';
            timeLabel.textContent = '0:00';
        };

        activeAudio.play();
    };

    window.seekAudio = (e, bar) => {
        if (!activeAudio) return;
        const rect = bar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        activeAudio.currentTime = pos * activeAudio.duration;
    };

    function openContextMenu(id, data) {
        if (data.isSystem) return;
        selectedMsgId = id;
        selectedMsgData = data;
        const isMy = data.user === currentUser.name;
        
        let canDelete = isMy;
        if (currentUser.role === 'owner') {
            canDelete = true;
        } else if (currentUser.role === 'admin') {
            if (data.user !== 'kuzyaalica') canDelete = true;
        }

        document.getElementById('dm-action').classList.toggle('hidden', isMy);
        document.getElementById('delete-action').classList.toggle('hidden', !canDelete || data.deleted);
        document.getElementById('context-menu').classList.remove('hidden');
    }

    window.closeContextMenu = (e) => {
        document.getElementById('context-menu').classList.add('hidden');
    };

    window.addReaction = (emoji) => {
        if (!selectedMsgId) return;
        set(child(activeMessagesRef, `${selectedMsgId}/reactions/${currentUser.name}`), emoji);
        closeContextMenu();
    };

    window.prepareReply = () => {
        replyToMsg = {
            user: selectedMsgData.user,
            text: selectedMsgData.text || 'Медиафайл'
        };
        document.getElementById('reply-target-text').textContent = replyToMsg.text;
        document.getElementById('reply-banner').classList.remove('hidden');
        closeContextMenu();
    };

    window.cancelReply = () => {
        replyToMsg = null;
        document.getElementById('reply-banner').classList.add('hidden');
        document.getElementById('message-input').placeholder = "Сообщение...";
    };

    window.deleteTargetMessage = () => {
        if (!selectedMsgId) return;
        update(child(activeMessagesRef, selectedMsgId), { deleted: true });
        closeContextMenu();
    };

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
